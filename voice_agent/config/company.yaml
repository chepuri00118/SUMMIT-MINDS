  # always routes to a human for a real quote.
  policy: "Give ballpark framing only, never a firm number. Any real quote comes from a human estimator after seeing drawings."
  ballpark: "Most shops we work with land somewhere in the usual per-ton market range - but it moves a lot with complexity, so our estimator prices off your actual drawings."

